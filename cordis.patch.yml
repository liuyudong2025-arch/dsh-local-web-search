# dsh-local-web-search bundle layer
# Disable DeepSeek's paid server-side Search/Fetch provider.
- id: web-search-deepseek
  disabled: true

# Route Harness's built-in web_search through this package's free provider.
# This works even when an Agent preset or a saved user layer keeps tool-web.
- id: web
  config:
    searchProvider: local-free
    fetchProvider: local-free

# Register the free provider plus native, clearly named local tools.
- insert:
    - id: local-web-search
      name: dsh-local-web-search
      config:
        provider: bing
        searxngUrl: http://127.0.0.1:8080
        timeoutMs: 20000
        maxFetchBytes: 5242880
        maxResults: 10
        autoFetchCount: 3
